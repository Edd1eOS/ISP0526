packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

# pnpm 11 requires explicit allow/deny of dependency install scripts.
# All three run native postinstall scripts; esbuild comes via vitest, the
# other two come from Next.js's official install chain.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
