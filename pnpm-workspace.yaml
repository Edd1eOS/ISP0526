packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  unrs-resolver: true

# pnpm 11 requires explicit allow/deny of dependency install scripts.
# Both packages run native postinstall scripts; we allow them as they
# come straight from Next.js's official install chain.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
